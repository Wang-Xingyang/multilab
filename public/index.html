<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MultiLab</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23356a9e' d='M9 2v6.5L4.4 19a2 2 0 0 0 1.8 3h11.6a2 2 0 0 0 1.8-3L15 8.5V2H9zm2 2h2v5l3.5 8H7.5L11 9V4z'/><circle cx='12' cy='16' r='1.4' fill='%23356a9e'/></svg>">

<!-- Vendor: xterm (本地 /vendor, 必须早于 Monaco loader.js 加载) -->
<link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
<script src="/vendor/xterm/lib/xterm.js"></script>
<script src="/vendor/addon-fit/lib/addon-fit.js"></script>
<script src="/vendor/addon-web-links/lib/addon-web-links.js"></script>
<!-- Vendor: marked v9 (最后一个有 global 变量的版本) + DOMPurify -->
<script src="/vendor/marked/marked.min.js"></script>
<script src="/vendor/dompurify/dist/purify.min.js"></script>
<!-- Vendor: Monaco Editor (必须最后加载 —— loader.js 会往全局注入 AMD define) -->
<script src="/vendor/monaco-editor/min/vs/loader.js"></script>

<style>
  /* ============================================================
     Design tokens
     深色工作台为默认; light 为完整对照。所有视觉走变量, 避免
     散落 rgba/写死圆角。
     ============================================================ */
  :root {
    /* surface 层级 (深 → 浅) */
    --bg:          #1b1b1d;   /* 工作区底 */
    --term-bg:     #1e1e1e;   /* 终端区: 与 xterm theme background 对齐, 避免 padding 露出色差 */
    --surface-1:   #232326;   /* 面板 (header/tutorial/file-tree/aux) */
    --surface-2:   #2b2b2f;   /* elevated: 输入/卡片/hover */
    --surface-3:   #33333a;   /* active/按下/选中行 */

    /* 边框 */
    --border:        #34343a;
    --border-strong: #42424a;

    /* 文字 */
    --text:        #dcdcdc;
    --text-dim:    #8a8a92;
    --text-faint:  #5f5f66;

    /* 主色 (IDE 蓝, 不用紫青渐变) */
    --accent:       #2a7d9e;
    --accent-hover: #3593b8;
    --accent-soft:  rgba(42, 125, 158, 0.18);
    --accent-line:  rgba(42, 125, 158, 0.55);

    /* 状态色 + soft 背景 */
    --success:      #4ec9b0;
    --success-soft: rgba(78, 201, 176, 0.14);
    --error:        #f06255;
    --error-soft:   rgba(240, 98, 85, 0.14);
    --warn:         #e0c97d;
    --warn-soft:    rgba(224, 201, 125, 0.14);
    --info:         #6cb6e0;

    /* focus */
    --focus-ring:   rgba(53, 147, 184, 0.55);

    /* 拖拽分隔线 */
    --drag:         #3a3a40;

    /* radius scale */
    --radius-xs: 3px;
    --radius-sm: 4px;
    --radius:    6px;
    --radius-lg: 8px;
    --radius-pill: 999px;

    /* shadow scale (克制, 不堆叠) */
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.25);
    --shadow-md: 0 4px 14px rgba(0,0,0,0.30);
    --shadow-lg: 0 14px 40px rgba(0,0,0,0.45);

    /* z-index scale */
    --z-drag:    10;
    --z-loading: 50;
    --z-status:  100;
    --z-toast:   200;
    --z-drawer:  250;
    --z-overlay: 300;
    --z-dialog:  320;

    /* motion (克制) */
    --ease:      cubic-bezier(0.2, 0, 0, 1);
    --dur-fast:  0.12s;
    --dur:       0.18s;
    --dur-slow:  0.28s;

    --header-h: 48px;
    --step-bar-h: 38px;
    --tab-h: 30px;
    --font-mono: "JetBrains Mono","Consolas","SF Mono",monospace;
    --font-ui: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  :root[data-theme="light"] {
    --bg:          #f6f7f9;
    --term-bg:     #ffffff;   /* 与 xterm light theme background 对齐 */
    --surface-1:   #ffffff;
    --surface-2:   #f1f2f5;
    --surface-3:   #e6e8ec;
    --border:        #e2e4e8;
    --border-strong: #cfd2d8;
    --text:        #1c1e22;
    --text-dim:    #61656d;
    --text-faint:  #9aa0a8;
    --accent:       #1f6f96;
    --accent-hover: #185a7a;
    --accent-soft:  rgba(31, 111, 150, 0.12);
    --accent-line:  rgba(31, 111, 150, 0.45);
    --success:      #0a8a5e;
    --success-soft: rgba(10, 138, 94, 0.12);
    --error:        #d12b2b;
    --error-soft:   rgba(209, 43, 43, 0.10);
    --warn:         #9a6a00;
    --warn-soft:    rgba(154, 106, 0, 0.12);
    --info:         #1f6f96;
    --focus-ring:   rgba(31, 111, 150, 0.45);
    --drag:         #d3d6db;
    --shadow-sm: 0 1px 2px rgba(15,23,42,0.08);
    --shadow-md: 0 4px 14px rgba(15,23,42,0.12);
    --shadow-lg: 0 14px 40px rgba(15,23,42,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, select:focus-visible, a:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 1px;
    border-radius: var(--radius-sm);
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--radius-pill); border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }

  /* ============================================================
     顶栏: 播放器 chrome（不放本步命令、不放 kernel 选择）
     左: brand + 教程 + 包管理 + 存档
     右: 收起教程 + 日志 + 诊断 + 主题
     ============================================================ */
  header {
    height: var(--header-h); display: flex; align-items: center;
    padding: 0 12px; gap: 8px;
    background: var(--surface-1); border-bottom: 1px solid var(--border);
  }
  .header-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .header-group + .header-group { position: relative; padding-left: 10px; }
  .header-group + .header-group::before {
    content: ''; position: absolute; left: 0; top: 10px; bottom: 10px;
    width: 1px; background: var(--border);
  }
  header .brand {
    font-weight: 600; font-size: 14px; letter-spacing: 0.2px;
    padding-right: 2px; display: flex; align-items: center; gap: 1px;
  }
  header .brand .dot { color: var(--success); margin: 0 1px; }
  header .spacer { flex: 1; min-width: 4px; }

  .tutorial-picker { position: relative; display: inline-flex; }
  .tutorial-picker-btn {
    height: 30px; max-width: 260px; padding: 0 10px; gap: 8px;
    display: inline-flex; align-items: center;
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius-sm); font-size: 13px;
  }
  .tutorial-picker-btn:hover, .tutorial-picker.open .tutorial-picker-btn {
    border-color: var(--border-strong); background: var(--surface-3);
  }
  .tutorial-picker-btn span {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .tutorial-picker-btn svg { flex-shrink: 0; color: var(--text-dim); }
  .tutorial-picker-pop {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: var(--z-overlay);
    width: min(380px, calc(100vw - 24px)); max-height: min(70vh, 420px);
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--surface-1); border: 1px solid var(--border-strong);
    border-radius: var(--radius); box-shadow: var(--shadow-md);
    animation: pop-in-menu var(--dur-fast) var(--ease);
  }
  .tutorial-picker-pop[hidden] { display: none !important; }
  .tutorial-picker-list {
    overflow-y: auto; padding: 4px; flex: 1 1 auto; min-height: 0;
    overscroll-behavior: contain; scrollbar-width: thin;
  }
  .tutorial-picker-group {
    padding: 8px 10px 4px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint);
  }
  .tutorial-picker-item {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: none; color: var(--text); padding: 8px 10px;
    border-radius: var(--radius-sm); font-size: 13px; cursor: pointer;
  }
  .tutorial-picker-item:hover { background: var(--surface-2); }
  .tutorial-picker-item.is-current { background: var(--accent-soft); }
  .tutorial-picker-item-text { min-width: 0; flex: 1; }
  .tutorial-picker-item-title {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500;
  }
  .tutorial-picker-item-meta { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
  .tutorial-picker-delete {
    flex-shrink: 0; font-size: 12px; color: var(--text-dim); padding: 4px 6px;
    border: none; background: none; cursor: pointer;
    border-radius: var(--radius-xs);
  }
  .tutorial-picker-delete:hover { color: var(--error); background: var(--error-soft); }
  .tutorial-picker-empty {
    padding: 18px 12px; text-align: center; color: var(--text-faint); font-size: 13px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .tutorial-picker-foot {
    border-top: 1px solid var(--border); padding: 4px; flex-shrink: 0;
  }
  .tutorial-picker-foot button {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: none; color: var(--text-dim); padding: 8px 10px;
    border-radius: var(--radius-sm); font-size: 12.5px;
  }
  .tutorial-picker-foot button:hover { background: var(--surface-2); color: var(--text); }
  .tutorial-picker-foot svg { color: var(--text-faint); flex-shrink: 0; }

  /* 通用按钮: 顶栏 / 底栏 / 抽屉共用 */
  .hdr-btn {
    background: transparent; color: var(--text-dim); border: 1px solid transparent;
    border-radius: var(--radius-sm); padding: 0 8px; height: 30px; font-size: 13px;
    display: inline-flex; align-items: center; gap: 5px;
    transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
    white-space: nowrap;
  }
  .hdr-btn:hover { background: var(--surface-2); color: var(--text); }
  .hdr-btn:active { background: var(--surface-3); }
  .hdr-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .hdr-btn:disabled:hover { background: transparent; color: var(--text-dim); }
  .hdr-btn.icon-only { padding: 0; width: 30px; justify-content: center; }
  .hdr-btn .lbl { font-size: 13px; }
  .hdr-btn.is-open { color: var(--text); background: var(--surface-2); }

  .hdr-btn.primary {
    background: var(--accent); color: #fff; border-color: var(--accent);
    font-weight: 500;
  }
  .hdr-btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
  .hdr-btn.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .hdr-btn.danger-hover:hover { color: var(--error); }
  .hdr-btn.ghost {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
  }
  .hdr-btn.ghost:hover { background: var(--surface-3); border-color: var(--border-strong); color: var(--text); }

  /* trust 徽章: 带状态点（诊断抽屉内） */
  .trust-badge {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); background: var(--surface-2);
    border-radius: var(--radius-sm); padding: 0 9px; height: 30px;
    font-size: 12.5px; color: var(--text-dim);
    transition: border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  .trust-badge:hover:not(:disabled) { border-color: var(--border-strong); color: var(--text); }
  .trust-badge:disabled { opacity: 0.6; cursor: default; }
  .trust-badge .status-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    background: var(--text-faint);
  }
  .trust-badge[data-state="user-trusted"] { color: var(--success); border-color: var(--success-soft); }
  .trust-badge[data-state="user-trusted"] .status-dot { background: var(--success); }
  .trust-badge[data-state="untrusted"] { color: var(--warn); }
  .trust-badge[data-state="untrusted"] .status-dot { background: var(--warn); }

  header input[type="file"] { display: none; }

  /* ============================================================
     主布局
     ============================================================ */
  main { display: flex; flex: 1; min-height: 0; }

  /* 可拖拽分隔线: 视觉 1px, 命中区 5px */
  .drag-handle-v {
    width: 5px; flex-shrink: 0; cursor: col-resize;
    position: relative; margin: 0 -2px; z-index: var(--z-drag);
  }
  .drag-handle-v::after {
    content: ''; position: absolute; top: 0; bottom: 0; left: 2px; width: 1px;
    background: var(--border); transition: background var(--dur) var(--ease);
  }
  .drag-handle-v:hover::after, .drag-handle-v.active::after { background: var(--accent-line); }

  .drag-handle-h {
    height: 5px; flex-shrink: 0; cursor: row-resize;
    position: relative; margin: -2px 0; z-index: var(--z-drag);
  }
  .drag-handle-h::after {
    content: ''; position: absolute; left: 0; right: 0; top: 2px; height: 1px;
    background: var(--border); transition: background var(--dur) var(--ease);
  }
  .drag-handle-h:hover::after, .drag-handle-h.active::after { background: var(--accent-line); }

  /* ============================================================
     左侧: 教程面板
     ============================================================ */
  .tutorial-panel {
    display: flex; flex-direction: column; background: var(--surface-1);
    min-width: 0;
  }
  .tutorial-content {
    flex: 1; overflow-y: auto; padding: 28px 28px 20px; line-height: 1.7;
    user-select: text; cursor: auto;
  }
  .tutorial-content.step-enter { animation: step-in var(--dur-slow) var(--ease); }
  @keyframes step-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pane-fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .tutorial-content h1 { font-size: 22px; line-height: 1.3; margin-bottom: 6px; letter-spacing: 0.1px; }
  .tutorial-content .step-eyebrow {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-faint); margin-bottom: 10px; font-weight: 600;
  }
  .tutorial-content h2 { font-size: 16px; margin: 22px 0 6px; font-weight: 600; }
  .tutorial-content h3 { font-size: 14px; margin: 16px 0 4px; font-weight: 600; color: var(--text); }
  .tutorial-content p { margin: 8px 0; }
  .tutorial-content ul, .tutorial-content ol { margin: 8px 0 8px 22px; }
  .tutorial-content li { margin: 3px 0; }
  .tutorial-content code {
    background: var(--surface-2); padding: 1px 6px; border-radius: var(--radius-xs);
    font-family: var(--font-mono); font-size: 12.5px; color: var(--warn);
    border: 1px solid var(--border);
  }
  .tutorial-content pre {
    background: var(--surface-2); padding: 8px 12px; border-radius: var(--radius);
    overflow-x: auto; margin: 12px 0; border: 1px solid var(--border);
  }
  .tutorial-content pre code { background: transparent; padding: 0; color: var(--text); border: none; font-size: 12.5px; }
  .tutorial-content .md-block {
    position: relative; margin: 12px 0; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--surface-2);
  }
  .tutorial-content .md-copy-btn {
    display: inline-flex; align-items: center; justify-content: center;
    position: absolute; top: 6px; right: 6px; z-index: 1;
    width: 22px; height: 22px; padding: 0;
    background: var(--surface-2); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: var(--radius-xs);
    user-select: none;
    opacity: 0; pointer-events: none;
    transition: opacity var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  .tutorial-content .md-block:hover .md-copy-btn,
  .tutorial-content .md-block:focus-within .md-copy-btn,
  .tutorial-content .md-copy-btn.is-copied {
    opacity: 1; pointer-events: auto;
  }
  .tutorial-content .md-copy-btn:hover { background: var(--surface-3); color: var(--text); }
  .tutorial-content .md-block pre {
    margin: 0; border: none; border-radius: 0; background: transparent;
    padding: 10px 12px; padding-right: 2.25rem;
  }
  .tutorial-content blockquote {
    border-left: 3px solid var(--accent-line); padding: 2px 12px;
    color: var(--text-dim); margin: 12px 0; background: var(--accent-soft);
    border-radius: 0 var(--radius-xs) var(--radius-xs) 0;
  }
  .tutorial-content a { color: var(--info); }
  .tutorial-content img { max-width: 100%; border-radius: var(--radius); }

  /* 教程空态 / 错误态: 工作台起手构图 */
  .tutorial-placeholder {
    display: flex; flex-direction: column; align-items: flex-start;
    padding: 40px 32px; color: var(--text-dim); gap: 6px;
  }
  .tutorial-placeholder .ph-title { font-size: 18px; font-weight: 600; color: var(--text); }
  .tutorial-placeholder .ph-sub { font-size: 13px; max-width: 420px; line-height: 1.6; }
  .tutorial-placeholder .ph-hint {
    margin-top: 14px; font-size: 12px; color: var(--text-faint);
    border-top: 1px solid var(--border); padding-top: 12px; width: 100%;
  }
  .tutorial-placeholder.error .ph-title { color: var(--error); }

  body.tutorial-collapsed #tutorial-panel,
  body.tutorial-collapsed #drag-v { display: none !important; }

  /* ============================================================
     右侧: 编辑器 | 预览 + 底栏终端
     ============================================================ */
  .workspace-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .workspace-main { flex: 1; display: flex; min-height: 0; min-width: 0; }
  .editor-column { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .preview-column {
    display: none; flex-direction: column; min-width: 180px; min-height: 0;
    background: var(--bg); flex: 1 1 42%;
  }
  .preview-column.visible { display: flex; }
  .preview-head {
    height: var(--tab-h); display: flex; align-items: center; padding: 0 10px;
    background: var(--surface-1); border-bottom: 1px solid var(--border);
    color: var(--text); font-size: 12px; flex-shrink: 0;
  }
  .preview-body {
    flex: 1; min-height: 0; overflow: auto; padding: 14px; font-size: 12px;
    display: flex; flex-direction: column;
  }
  .preview-body .preview-frame { flex: 1 1 auto; min-height: 0; height: auto; }
  .preview-body .aux-empty { flex: 1; justify-content: center; }

  /* center-right: file-tree (opens left of a fixed right-edge toggle) */
  .file-tree-panel {
    width: 200px; flex-shrink: 0; display: none; flex-direction: column;
    background: var(--surface-1); min-width: 140px; max-width: 360px;
  }
  .file-tree-panel.visible:not(.collapsed) { display: flex; }
  .file-tree-body { flex: 1; overflow: auto; padding: 4px 0; font-size: 12px; }
  .file-tree-item {
    display: flex; align-items: center; gap: 4px;
    padding: 1px 8px 1px calc(4px + var(--depth, 0) * 12px);
    min-height: 22px;
    cursor: pointer; color: var(--text-dim); white-space: nowrap; overflow: hidden;
    transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  .file-tree-item .file-tree-name { overflow: hidden; text-overflow: ellipsis; }
  .file-tree-item .tab-icon { width: 13px; height: 13px; flex-shrink: 0; }
  .file-tree-item:hover { background: var(--surface-2); color: var(--text); }
  .file-tree-item.active { color: var(--text); background: var(--accent-soft); }
  .file-tree-item.dir { color: var(--text); cursor: pointer; font-weight: 500; }
  .file-tree-empty { padding: 16px 12px; color: var(--text-faint); font-size: 12px; text-align: center; }

  /* 文件 Tab 栏 */
  .file-tabs {
    height: var(--tab-h); display: flex; align-items: stretch; background: var(--surface-1);
    border-bottom: 1px solid var(--border); padding: 0 2px; gap: 0; overflow-x: auto;
    scrollbar-width: none;
  }
  .file-tabs .tab-tree-btn {
    margin-left: auto; flex-shrink: 0; width: var(--tab-h); height: 100%;
    display: none; align-items: center; justify-content: center;
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    transition: color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
  }
  .file-tabs .tab-tree-btn:hover { color: var(--text); background: var(--surface-2); }
  .file-tabs .tab-tree-btn.is-open { color: var(--accent); background: var(--accent-soft); }
  .file-tabs::-webkit-scrollbar { display: none; }
  .file-tabs .tab {
    padding: 0 8px; font-size: 12px; display: flex; align-items: center; gap: 5px;
    color: var(--text-dim); border-bottom: 2px solid transparent;
    cursor: pointer; white-space: nowrap; transition: all var(--dur-fast) var(--ease); flex-shrink: 0;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  }

  .picker-overlay {

  /* 对话框 (trust-dialog + 通用 app-dialog 共享样式) */
  .trust-dialog, .app-dialog {

  /* ============================================================
     顶栏下拉菜单 (当前教程进度)
     ============================================================ */
  .menu { position: relative; display: inline-flex; }
  .menu-pop {
    position: absolute; top: calc(100% + 4px); left: 0; min-width: 168px;

  .file-tree-item.file::before {

            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><polyline points='6 9 12 15 18 9' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/></svg>") center / contain no-repeat;

  }
</style>
</head>

        <div class="tutorial-picker-foot">
          <button type="button" id="import-package-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span data-i18n="package.openMlab">打开 .mlab</span>
          </button>
        </div>
      </div>
    </div>
    <div class="menu" id="save-menu">
      <button id="save-menu-trigger" class="hdr-btn menu-trigger" data-i18n-title="chrome.saveMenu">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        <span class="lbl" data-i18n="chrome.progressMenu">进度</span>
      </button>
      <div class="menu-pop">
        <button type="button" id="export-save-btn" disabled><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span class="m-label" data-i18n="save.exportProgress"></span></button>
        <button type="button" id="import-save-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span class="m-label" data-i18n="save.importProgress"></span></button>
      </div>
    </div>
  </div>

  <div class="spacer"></div>

  <div class="header-group">
    <button id="diag-btn" class="hdr-btn" type="button" data-i18n-title="chrome.diagnostics">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      <span class="lbl" data-i18n="views.diagnostics">诊断</span>
    </button>
    <button id="theme-btn" class="hdr-btn icon-only" data-i18n-title="chrome.theme">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </div>

  <input id="import-package-file" type="file" accept=".mlab,application/zip" hidden>
  <input id="import-save-file" type="file" accept=".mlab-save,application/zip" hidden>
</header>

<main>
  <section class="tutorial-panel" id="tutorial-panel">
    <div class="tutorial-content" id="tutorial-content">
      <div class="tutorial-placeholder">
        <div class="ph-title" data-i18n="tutorial.placeholderLoadingTitle">正在加载教程</div>
        <div class="ph-sub" data-i18n="tutorial.placeholderLoadingSub">MultiLab 正在读取本地教程目录与已导入的包。</div>
      </div>
    </div>
  </section>
  <div class="drag-handle-v" id="drag-v"></div>
  <section class="workspace-panel" id="workspace-panel">
    <div class="workspace-main" id="workspace-main">
      <div class="editor-column" id="editor-column">
        <div class="file-tabs" id="file-tabs">
          <button class="tab-tree-btn" id="tab-show-tree-btn" type="button" data-i18n-title="files.treeTitle" data-i18n-aria="files.toggleTree" aria-pressed="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
          </button>
        </div>
        <div class="editor-wrap" id="editor-wrap">
          <div id="monaco"></div>
          <div class="editor-view" id="pane-test-results">
            <div class="aux-empty">
              <svg class="empty-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              <span data-i18n="chrome.testEmpty">运行检查后，结果会显示在这里。</span>
            </div>
          </div>
        </div>
      </div>
      <div class="drag-handle-v" id="drag-v-preview" style="display:none"></div>
      <div class="preview-column" id="preview-column">
        <div class="preview-head" data-i18n="views.preview">预览</div>
        <div class="preview-body" id="pane-web-preview">
          <div class="aux-empty">
            <svg class="empty-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <span data-i18n="chrome.previewEmpty">运行预览命令后，内容会显示在这里。</span>
          </div>
        </div>
      </div>
      <div class="drag-handle-v" id="drag-v-tree" style="display:none"></div>
      <aside class="file-tree-panel" id="file-tree-panel">
        <div class="file-tree-body" id="file-tree-body">
          <div class="file-tree-empty" data-i18n="files.loading">加载中...</div>
        </div>
      </aside>
    </div>
    <div class="drag-handle-h" id="drag-h"></div>
    <div class="terminal-wrap" id="terminal-wrap">
      <div id="terminal"></div>
    </div>
  </section>
</main>

<footer class="step-bar">
  <div class="step-nav">
    <button id="prev-step" type="button" data-i18n-title="tutorial.prev">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button id="next-step" type="button" data-i18n-title="tutorial.next">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
  <nav class="step-dots" id="step-dots" data-i18n-aria="tutorial.dots" aria-label="步骤进度"></nav>
  <div class="step-now" id="step-now"></div>
  <div class="step-cmds">
    <button id="interrupt-btn" class="hdr-btn icon-only ghost" data-i18n-title="chrome.interrupt">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
    </button>
    <button id="run-btn" class="hdr-btn primary" data-i18n-title="chrome.run">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg>
      <span class="lbl" data-i18n="chrome.runLabel">运行</span>
    </button>
    <button id="test-btn" class="hdr-btn primary" data-i18n-title="chrome.test">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20,6 9,17 4,12"/></svg>
      <span class="lbl" data-i18n="chrome.testLabel">检查</span>
    </button>
    <button id="preview-btn" class="hdr-btn primary" data-i18n-title="chrome.preview" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      <span class="lbl" data-i18n="chrome.previewLabel">预览</span>
    </button>
    <button id="revert-btn" class="hdr-btn ghost" data-i18n-title="chrome.revert">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      <span class="lbl" data-i18n="chrome.resetLabel">重做</span>
    </button>
    <button id="solution-btn" class="hdr-btn ghost" data-i18n-title="chrome.solution" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span class="lbl" data-i18n="chrome.solutionLabel">看答案</span>
    </button>
  </div>
</footer>

<aside class="host-drawer" id="host-drawer" hidden>
  <div class="drawer-head">
    <span data-i18n="views.diagnostics">诊断</span>
    <button type="button" class="drawer-close" id="drawer-close" data-i18n-title="chrome.close" data-i18n-aria="chrome.close">×</button>
  </div>
  <div class="drawer-scroll">
    <div class="drawer-actions">
      <button id="trust-btn" class="trust-badge" data-i18n-title="trust.title" disabled data-state="">
        <span class="status-dot"></span><span class="lbl" data-i18n="trust.unloaded">未加载</span>
      </button>
      <button id="reconnect-btn" class="hdr-btn ghost" data-i18n-title="chrome.reconnect" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span class="lbl" data-i18n="chrome.reconnectLabel">重连终端</span>
      </button>
    </div>
    <div class="drawer-body" id="pane-diagnostics">
      <div class="aux-empty">
        <svg class="empty-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        <span data-i18n="diagnostics.emptyHint">打开教程后可查看 kernel / trust / runtime 诊断。</span>
      </div>
    </div>
    <h4 class="drawer-section" data-i18n="views.logs">日志</h4>
    <div class="drawer-body" id="pane-logs">
      <div class="aux-empty">
        <svg class="empty-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span data-i18n="panels.logsEmpty">会话日志会显示在这里。</span>
      </div>
    </div>
  </div>
</aside>

<div class="status-bar" id="status-bar"></div>
<div class="toast" id="toast"></div>

<!-- 文件选择器 (下拉面板) -->
<div class="picker-overlay" id="file-picker-overlay" style="display:none">
  <div class="picker-dropdown" id="file-picker-dropdown">
    <div class="picker-header">
      <span class="ph-label">/home/student/workspace</span>
      <div class="picker-header-actions">
        <button class="picker-refresh" id="picker-refresh-btn">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/></svg>
          <span data-i18n="chrome.refresh">刷新</span>
        </button>
        <button type="button" class="picker-close" id="file-picker-close-btn" data-i18n-title="chrome.close" data-i18n-aria="chrome.close">×</button>
      </div>
    </div>
    <div class="picker-body" id="file-picker-list">
      <div class="file-empty" data-i18n="files.loading">加载中...</div>
    </div>
  </div>
</div>

<!-- Trust 确认对话框 -->
<div class="picker-overlay" id="trust-overlay" style="display:none">
  <div class="trust-dialog" id="trust-dialog" role="dialog" aria-modal="true" aria-labelledby="trust-dialog-title">
    <div class="dialog-icon" id="trust-dialog-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </div>
    <h3 id="trust-dialog-title" data-i18n="trust.confirmGrantTitle">确认信任此教程包？</h3>
    <p id="trust-dialog-body" data-i18n="trust.confirmGrantBody">信任表示你接受运行该包声明的命令。MultiLab 仍会按 security / sandbox / network 策略限制执行。不要信任来源不明的包。</p>
    <div class="digest-label" data-i18n="chrome.packageDigest">Package digest</div>
    <div class="digest" id="trust-dialog-digest"></div>
    <div class="trust-actions">
      <button type="button" id="trust-cancel-btn" data-i18n="dialog.cancel">取消</button>
      <button type="button" id="trust-confirm-btn" class="primary" data-i18n="trust.confirmGrantAction">确认信任</button>
    </div>
  </div>
</div>

<!-- 加载提示 -->
<div id="loading-msg"><span class="spinner"></span><span data-i18n="chrome.loadingEditor">正在加载编辑器...</span></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
