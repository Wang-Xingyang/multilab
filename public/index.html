<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MultiLab</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">

<!-- Vendor: xterm (本地 /vendor, 必须早于 Monaco loader.js 加载) -->
<link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
<script src="/vendor/xterm/lib/xterm.js"></script>
<script src="/vendor/addon-fit/lib/addon-fit.js"></script>
<script src="/vendor/addon-web-links/lib/addon-web-links.js"></script>
<!-- Vendor: marked v9 (最后一个有 global 变量的版本) + DOMPurify -->
<script src="/vendor/marked/marked.min.js"></script>
<script src="/vendor/dompurify/dist/purify.min.js"></script>
<!-- Vendor: Monaco Editor (必须最后加载 —— loader.js 会往全局注入 AMD define) -->
<script src="/vendor/monaco-editor/min/vs/loader.js"></script>

<style>
  :root {
    --bg: #1e1e1e;
    --bg-panel: #252526;
    --bg-elev: #2d2d2d;
    --border: #3c3c3c;
    --text: #d4d4d4;
    --text-dim: #8a8a8a;
    --accent: #0e639c;
    --accent-hover: #1177bb;
    --success: #4ec9b0;
    --error: #f48771;
    --warn: #dcdcaa;
    --drag-handle: #555;
  }
  :root[data-theme="light"] {
    --bg: #ffffff;
    --bg-panel: #f8f8f8;
    --bg-elev: #ffffff;
    --border: #e0e0e0;
    --text: #1e1e1e;
    --text-dim: #6a6a6a;
    --accent: #0066b8;
    --accent-hover: #005a9e;
    --success: #098658;
    --error: #d73a49;
    --warn: #b58900;
    --drag-handle: #ccc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    overflow: hidden;
    user-select: none;
  }
  button { font-family: inherit; cursor: pointer; }

  /* === 顶部栏 === */
  header {
    height: 48px; display: flex; align-items: center; padding: 0 16px;
    background: var(--bg-panel); border-bottom: 1px solid var(--border); gap: 12px;
  }
  header .brand { font-weight: 600; font-size: 15px; letter-spacing: 0.3px; }
  header .brand .dot { color: var(--success); }
  header select {
    background: var(--bg-elev); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 8px; font-size: 13px;
  }
  header .spacer { flex: 1; }
  header button {
    background: transparent; color: var(--text-dim); border: 1px solid transparent;
    border-radius: 4px; padding: 6px 10px; font-size: 13px; transition: all 0.15s;
  }
  header button:hover { background: var(--bg-elev); color: var(--text); }
  header .run-btn { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
  header .run-btn:hover { background: var(--accent-hover); }
  header .run-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* === 主布局 === */
  main {
    display: flex; height: calc(100vh - 48px);
  }
  /* 可拖拽分隔线: 视觉 1px, 命中区 3px */
  .drag-handle-v {
    width: 5px; flex-shrink: 0; cursor: col-resize;
    position: relative; margin: 0 -2px; z-index: 10;
  }
  .drag-handle-v::after {
    content: ''; position: absolute; top: 0; bottom: 0;
    left: 2px; width: 1px; background: var(--border); transition: background 0.15s;
  }
  .drag-handle-v:hover::after,
  .drag-handle-v.active::after { background: var(--accent); }

  .drag-handle-h {
    height: 5px; flex-shrink: 0; cursor: row-resize;
    position: relative; margin: -2px 0; z-index: 10;
  }
  .drag-handle-h::after {
    content: ''; position: absolute; left: 0; right: 0;
    top: 2px; height: 1px; background: var(--border); transition: background 0.15s;
  }
  .drag-handle-h:hover::after,
  .drag-handle-h.active::after { background: var(--accent); }

  /* 左侧:教程 */
  .tutorial-panel {
    display: flex; flex-direction: column; background: var(--bg-panel);
    border-right: none; /* 分隔线替代了 border */
  }
  .tutorial-content {
    flex: 1; overflow-y: auto; padding: 24px 32px; line-height: 1.7;
  }
  .tutorial-content h1 { font-size: 22px; margin-bottom: 12px; }
  .tutorial-content h2 { font-size: 18px; margin: 24px 0 8px; }
  .tutorial-content h3 { font-size: 15px; margin: 20px 0 6px; }
  .tutorial-content p { margin: 8px 0; }
  .tutorial-content ul, .tutorial-content ol { margin: 8px 0 8px 24px; }
  .tutorial-content li { margin: 4px 0; }
  .tutorial-content code {
    background: var(--bg-elev); padding: 2px 6px; border-radius: 3px;
    font-family: "JetBrains Mono","Consolas",monospace; font-size: 12.5px; color: var(--warn);
  }
  .tutorial-content pre {
    background: var(--bg-elev); padding: 12px 16px; border-radius: 6px; overflow-x: auto; margin: 12px 0;
  }
  .tutorial-content pre code { background: transparent; padding: 0; color: var(--text); }
  .tutorial-content blockquote {
    border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text-dim); margin: 12px 0;
  }
  .progress-strip {
    border-top: 1px solid var(--border); padding: 8px 12px 6px;
    background: var(--bg-panel); max-height: 120px; overflow-y: auto;
  }
  .progress-strip:empty { display: none; }
  .progress-item {
    display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 4px;
    font-size: 12px; color: var(--text-dim); cursor: pointer;
  }
  .progress-item:hover { background: var(--bg-elev); color: var(--text); }
  .progress-item.current { color: var(--text); background: rgba(14, 99, 156, 0.18); }
  .progress-item .mark {
    width: 16px; text-align: center; flex-shrink: 0; font-size: 11px;
  }
  .progress-item.passed .mark { color: var(--success); }
  .progress-item.failed .mark { color: var(--error); }
  .progress-item.visited .mark { color: var(--warn); }
  .tutorial-nav {
    border-top: 1px solid var(--border); padding: 10px 16px;
    display: flex; align-items: center; gap: 10px; background: var(--bg-panel);
  }
  .tutorial-nav .step-info { color: var(--text-dim); font-size: 12px; flex: 1; }
  .tutorial-nav button {
    background: var(--bg-elev); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 5px 12px; font-size: 13px;
  }
  .tutorial-nav button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 右侧:编辑器 + 终端 */
  .workspace-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .workspace-main {
    flex: 1; display: flex; min-height: 0; min-width: 0;
  }
  .editor-column {
    flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0;
  }

  /* center-left: file-tree */
  .file-tree-panel {
    width: 200px; flex-shrink: 0; display: none; flex-direction: column;
    background: var(--bg-panel); min-width: 140px; max-width: 360px;
  }
  .file-tree-panel.visible { display: flex; }
  .file-tree-head {
    height: 32px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px; border-bottom: 1px solid var(--border);
    font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em;
  }
  .file-tree-head button {
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 3px; font-size: 11px; padding: 1px 6px;
  }
  .file-tree-head button:hover { color: var(--text); }
  .file-tree-body {
    flex: 1; overflow: auto; padding: 4px 0; font-size: 12px;
  }
  .file-tree-item {
    display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px calc(8px + var(--depth, 0) * 12px);
    cursor: pointer; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .file-tree-item:hover { background: var(--bg-elev); color: var(--text); }
  .file-tree-item.active { color: var(--text); background: rgba(14, 99, 156, 0.18); }
  .file-tree-item.dir { color: var(--text); cursor: default; font-weight: 500; }
  .file-tree-empty { padding: 16px 10px; color: var(--text-dim); font-size: 12px; text-align: center; }

  /* 文件 Tab 栏 */
  .file-tabs {
    height: 32px; display: flex; align-items: stretch; background: var(--bg-panel);
    border-bottom: 1px solid var(--border); padding: 0 4px; gap: 0; overflow-x: auto;
  }
  .file-tabs .tab {
    padding: 0 10px; font-size: 12px; display: flex; align-items: center; gap: 6px;
    color: var(--text-dim); border-bottom: 2px solid transparent;
    cursor: pointer; white-space: nowrap; transition: all 0.15s; flex-shrink: 0;
    border-radius: 4px 4px 0 0;
  }
  .file-tabs .tab:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .file-tabs .tab.active { color: var(--text); border-bottom-color: var(--accent); background: rgba(255,255,255,0.03); }
  .file-tabs .tab .tab-modified { color: var(--warn); font-size: 14px; line-height: 1; }
  .file-tabs .tab .tab-close {
    margin-left: 2px; font-size: 14px; opacity: 0; color: var(--text-dim);
    cursor: pointer; line-height: 1; padding: 0 2px; border-radius: 2px;
    transition: opacity 0.15s;
  }
  .file-tabs .tab:hover .tab-close { opacity: 0.6; }
  .file-tabs .tab .tab-close:hover { opacity: 1; background: rgba(255,255,255,0.1); color: var(--error); }
  .file-tabs .tab-new {
    padding: 0 10px; font-size: 16px; display: flex; align-items: center; cursor: pointer;
    color: var(--text-dim); transition: all 0.15s; flex-shrink: 0; border-radius: 4px;
  }
  .file-tabs .tab-new:hover { color: var(--text); background: rgba(255,255,255,0.06); }

  .editor-wrap {
    flex: 1; border-bottom: none; position: relative; /* 分隔线替代了 border */
    min-height: 0;
  }
  .editor-column .file-tabs { flex-shrink: 0; }
  #monaco { position: absolute; inset: 0; }
  .terminal-wrap {
    flex: 1; background: var(--bg); padding: 8px 10px; overflow: hidden; position: relative;
  }
  #terminal { height: 100%; }

  /* === 右侧辅助面板: test-results / web-preview === */
  .aux-panel {
    width: 320px; flex-shrink: 0; display: none; flex-direction: column;
    background: var(--bg-panel); border-left: none; min-width: 220px;
  }
  .aux-panel.visible { display: flex; }
  .aux-tabs {
    height: 32px; display: flex; align-items: stretch; border-bottom: 1px solid var(--border);
    padding: 0 4px; gap: 0;
  }
  .aux-tabs button {
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--text-dim); padding: 0 10px; font-size: 12px;
  }
  .aux-tabs button:hover { color: var(--text); }
  .aux-tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
  .aux-tabs .aux-close {
    margin-left: auto; color: var(--text-dim); padding: 0 8px; font-size: 14px;
  }
  .aux-body { flex: 1; overflow: auto; padding: 12px; font-size: 12px; }
  .aux-pane { display: none; height: 100%; }
  .aux-pane.active { display: block; }
  .test-result-badge {
    display: inline-block; padding: 2px 8px; border-radius: 3px; font-weight: 600; margin-bottom: 8px;
  }
  .test-result-badge.pass { background: rgba(78,201,176,0.15); color: var(--success); }
  .test-result-badge.fail { background: rgba(244,135,113,0.15); color: var(--error); }
  .test-result-output, .preview-output {
    white-space: pre-wrap; word-break: break-word; font-family: "JetBrains Mono","Consolas",monospace;
    color: var(--text); line-height: 1.5;
  }
  .preview-frame {
    width: 100%; height: calc(100% - 8px); min-height: 240px; border: 1px solid var(--border);
    border-radius: 4px; background: #fff;
  }
  .aux-empty { color: var(--text-dim); padding: 16px 0; }

  /* === 状态条 === */
  .status-bar {
    position: fixed; bottom: 0; right: 0; padding: 3px 10px; background: var(--accent);
    color: #fff; font-size: 11px; border-top-left-radius: 4px; z-index: 100; opacity: 0; transition: opacity 0.3s;
  }
  .status-bar.show { opacity: 1; }

  /* === Toast === */
  /* 顶部 bar 高 48px, toast 中心对齐 bar 中线 (24px) */
  .toast {
    position: fixed; top: 24px; left: 50%;
    transform: translateX(-50%) translateY(-50%) translateY(-8px);
    background: var(--bg-elev); color: var(--text); padding: 8px 16px;
    border-radius: 6px; border: 1px solid var(--border); z-index: 200;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25); opacity: 0;
    transition: opacity 0.25s, transform 0.25s; pointer-events: none;
    font-size: 13px; display: flex; align-items: center; gap: 8px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-50%); }
  .toast.error { border-color: var(--error); color: var(--error); }
  .toast svg { flex-shrink: 0; }

  /* === 文件选择器 (居中偏上弹窗风格) === */
  .picker-overlay { position: fixed; inset: 0; z-index: 300; display: none; background: rgba(0,0,0,0.3); }
  .picker-dropdown {
    position: fixed; top: 25%; left: 50%; transform: translate(-50%, -50%);
    background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px;
    width: 360px; max-height: 400px; display: flex; flex-direction: column;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .picker-header {
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--text-dim);
    display: flex; justify-content: space-between; align-items: center;
  }
  .picker-body { padding: 4px; overflow-y: auto; flex: 1; }
  .picker-body .file-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    border-radius: 4px; cursor: pointer; font-size: 13px; transition: background 0.1s;
  }
  .picker-body .file-item:hover { background: var(--bg-elev); }
  .picker-body .file-empty { padding: 16px; text-align: center; color: var(--text-dim); font-size: 13px; }
  .picker-refresh { background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 3px; cursor: pointer; font-size: 11px; padding: 2px 8px; }
  .picker-refresh:hover { color: var(--text); border-color: var(--text-dim); }
  .picker-header-actions { display: flex; align-items: center; gap: 8px; }
  .picker-close { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 3px; }
  .picker-close:hover { color: var(--text); background: var(--bg-elev); }

  .library-dropdown {
    position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
    background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px;
    width: min(720px, calc(100vw - 32px)); max-height: min(70vh, 520px);
    display: flex; flex-direction: column;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .library-body { padding: 8px; overflow-y: auto; flex: 1; }
  .library-item {
    border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px;
    background: var(--bg);
  }
  .library-item-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .library-title { font-size: 13px; font-weight: 600; }
  .library-meta { font-size: 12px; color: var(--text-dim); margin-top: 4px; line-height: 1.5; word-break: break-all; }
  .library-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .library-actions button {
    background: var(--bg-elev); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 8px; font-size: 12px;
  }
  .library-actions button:hover { border-color: var(--text-dim); }
  .library-actions button.danger { color: var(--error); }
  .library-empty { padding: 24px; text-align: center; color: var(--text-dim); font-size: 13px; }

  .diag-block { margin-bottom: 14px; }
  .diag-block h4 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-dim); margin-bottom: 6px;
  }
  .diag-kv {
    display: grid; grid-template-columns: 88px 1fr; gap: 4px 8px;
    font-family: "JetBrains Mono","Consolas",monospace; font-size: 11px; line-height: 1.45;
  }
  .diag-kv .k { color: var(--text-dim); }
  .diag-kv .v { color: var(--text); word-break: break-all; }
  .diag-list { margin: 0; padding-left: 16px; color: var(--text-dim); }
  .diag-list li { margin: 2px 0; }
  .log-line {
    font-family: "JetBrains Mono","Consolas",monospace; font-size: 11px;
    padding: 2px 0; border-bottom: 1px solid transparent; color: var(--text-dim);
    white-space: pre-wrap; word-break: break-word;
  }
  .log-line.warn { color: var(--warn); }
  .log-line.error { color: var(--error); }
  .log-line.info { color: var(--text); }
  .log-time { color: var(--text-dim); margin-right: 6px; }

  .trust-dialog {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(440px, calc(100vw - 32px)); background: var(--bg-panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.55); z-index: 120;
  }
  .trust-dialog h3 { font-size: 15px; margin-bottom: 8px; }
  .trust-dialog p { font-size: 13px; color: var(--text-dim); line-height: 1.55; margin: 8px 0; }
  .trust-dialog .digest {
    font-family: "JetBrains Mono","Consolas",monospace; font-size: 11px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
    padding: 8px 10px; word-break: break-all; margin: 10px 0 14px; color: var(--text);
  }
  .trust-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .trust-actions button {
    background: var(--bg-elev); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 6px 12px; font-size: 13px;
  }
  .trust-actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .trust-actions button.danger { color: var(--error); }
</style>
</head>
<body>

<header>
  <div class="brand">Multi<span class="dot">·</span>Lab</div>
  <select id="tutorial-select"><option value="">加载中...</option></select>
  <button id="library-btn" title="管理已导入的教程包">教程库</button>
  <button id="import-package-btn" title="从本机选择并打开 .mlab">打开 .mlab</button>
  <button id="export-save-btn" title="下载当前进度为 .mlab-save" disabled>导出进度</button>
  <button id="import-save-btn" title="从本机选择并导入 .mlab-save">导入进度</button>
  <select id="kernel-select" title="当前教程可用 kernel" disabled>
    <option value="">kernel…</option>
  </select>
  <button id="reconnect-btn" title="重连终端到当前 runtime" disabled>重连终端</button>
  <button id="logs-btn" title="打开会话日志面板" style="display:none">日志</button>
  <button id="diag-btn" title="打开诊断面板" style="display:none">诊断</button>
  <button id="trust-btn" title="当前 package trust 状态" disabled>未加载</button>
  <input id="import-package-file" type="file" accept=".mlab,application/zip" hidden>
  <input id="import-save-file" type="file" accept=".mlab-save,application/zip" hidden>
  <div class="spacer"></div>
  <button id="theme-btn" title="切换主题">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
  <button id="revert-btn" title="重置当前 step">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
  </button>
  <button id="save-btn" title="保存到容器 (Ctrl+S)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
  </button>
  <button id="interrupt-btn" title="中断 (Ctrl+C)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
  </button>
  <button id="run-btn" class="run-btn" title="运行 (Ctrl+Enter)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg>
  </button>
  <button id="test-btn" title="检查当前 step">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20,6 9,17 4,12"/></svg>
  </button>
  <button id="preview-btn" title="预览" style="display:none">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
  <button id="export-btn" title="导出工作区">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
  </button>
</header>

<main>
  <section class="tutorial-panel" id="tutorial-panel">
    <div class="tutorial-content" id="tutorial-content">
      <p style="color: var(--text-dim)">正在加载教程...</p>
    </div>
    <div class="progress-strip" id="progress-strip" aria-label="学习进度"></div>
    <div class="tutorial-nav">
      <button id="prev-step"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:4px"><polyline points="15 18 9 12 15 6"/></svg>上一步</button>
      <span class="step-info" id="step-info">—</span>
      <button id="next-step">下一步<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-left:4px"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
  </section>
  <div class="drag-handle-v" id="drag-v"></div>
  <section class="workspace-panel" id="workspace-panel">
    <div class="workspace-main" id="workspace-main">
      <aside class="file-tree-panel" id="file-tree-panel">
        <div class="file-tree-head">
          <span>Files</span>
          <button type="button" id="file-tree-refresh-btn" title="刷新文件树">刷新</button>
        </div>
        <div class="file-tree-body" id="file-tree-body">
          <div class="file-tree-empty">加载中...</div>
        </div>
      </aside>
      <div class="drag-handle-v" id="drag-v-tree" style="display:none"></div>
      <div class="editor-column" id="editor-column">
        <div class="file-tabs" id="file-tabs">
          <div class="tab-new" id="tab-open-btn" title="打开容器文件">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          </div>
        </div>
        <div class="editor-wrap" id="editor-wrap"><div id="monaco"></div></div>
      </div>
    </div>
    <div class="drag-handle-h" id="drag-h"></div>
    <div class="terminal-wrap" id="terminal-wrap">
      <div id="terminal"></div>
    </div>
  </section>
  <div class="drag-handle-v" id="drag-v-aux" style="display:none"></div>
  <aside class="aux-panel" id="aux-panel">
    <div class="aux-tabs">
      <button type="button" data-aux-tab="test-results" class="active">检查结果</button>
      <button type="button" data-aux-tab="web-preview">Preview</button>
      <button type="button" data-aux-tab="logs">日志</button>
      <button type="button" data-aux-tab="diagnostics">诊断</button>
      <button type="button" class="aux-close" id="aux-close-btn" title="关闭面板">×</button>
    </div>
    <div class="aux-body">
      <div class="aux-pane active" id="pane-test-results">
        <div class="aux-empty">运行检查后，结果会显示在这里。</div>
      </div>
      <div class="aux-pane" id="pane-web-preview">
        <div class="aux-empty">运行预览命令后，内容会显示在这里。</div>
      </div>
      <div class="aux-pane" id="pane-logs">
        <div class="aux-empty">会话日志会显示在这里。</div>
      </div>
      <div class="aux-pane" id="pane-diagnostics">
        <div class="aux-empty">打开教程后可查看 kernel / trust / runtime 诊断。</div>
      </div>
    </div>
  </aside>
</main>

<div class="status-bar" id="status-bar"></div>
<div class="toast" id="toast"></div>

<!-- 文件选择器 (下拉面板) -->
<div class="picker-overlay" id="file-picker-overlay" style="display:none">
  <div class="picker-dropdown" id="file-picker-dropdown">
    <div class="picker-header">
      <span>/home/student/workspace</span>
      <div class="picker-header-actions">
        <button class="picker-refresh" id="picker-refresh-btn">刷新</button>
        <button type="button" class="picker-close" id="file-picker-close-btn" title="关闭" aria-label="关闭">×</button>
      </div>
    </div>
    <div class="picker-body" id="file-picker-list">
      <div class="file-empty">加载中...</div>
    </div>
  </div>
</div>

<!-- 教程库 -->
<div class="picker-overlay" id="library-overlay" style="display:none">
  <div class="library-dropdown" id="library-dropdown">
    <div class="picker-header">
      <span>已导入教程库</span>
      <div class="picker-header-actions">
        <button class="picker-refresh" id="library-refresh-btn">刷新</button>
        <button type="button" class="picker-close" id="library-close-btn" title="关闭" aria-label="关闭">×</button>
      </div>
    </div>
    <div class="library-body" id="library-list">
      <div class="library-empty">加载中...</div>
    </div>
  </div>
</div>

<!-- Trust 确认对话框 -->
<div class="picker-overlay" id="trust-overlay" style="display:none">
  <div class="trust-dialog" id="trust-dialog" role="dialog" aria-modal="true" aria-labelledby="trust-dialog-title">
    <h3 id="trust-dialog-title">确认信任此教程包？</h3>
    <p id="trust-dialog-body">信任后仍会按 package 安全策略与 sandbox 限制执行命令。只应信任你了解来源的包。</p>
    <div class="digest" id="trust-dialog-digest"></div>
    <div class="trust-actions">
      <button type="button" id="trust-cancel-btn">取消</button>
      <button type="button" id="trust-confirm-btn" class="primary">确认信任</button>
    </div>
  </div>
</div>

<!-- 加载提示 -->
<div id="loading-msg" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--text-dim);font-size:13px;z-index:50;pointer-events:none">正在加载编辑器...</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
